<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --ink: #081220;
    --ink-2: #0f1c30;
    --ivory: #F7F4EC;
    --ivory-dim: #EDE8DA;
    --brass: #C6A15B;
    --brass-dim: #8A754A;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.14);
    --text-dim: rgba(247,244,236,0.55);
    --text-mid: rgba(247,244,236,0.78);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--ivory);
    font-family: 'Hanken Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 32px 80px;
  }

  .top-bar {
    height: 4px;
    background: linear-gradient(90deg, #C6A15B 0%, #E8C97A 35%, #7FA5C9 70%, #4A6B8A 100%);
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 8px 0 6px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
    text-align: left;
  }
  .brand:hover .brand-mark { border-color: var(--ivory); }
  .brand:hover .brand-word .bold { color: var(--brass); }
  .brand-mark {
    width: 40px;
    height: 40px;
    border: 1px solid var(--brass);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.15s;
  }
  .brand-mark span {
    font-family: 'Hanken Grotesk', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--brass);
    letter-spacing: 0.03em;
  }
  .brand-divider {
    width: 1px;
    height: 30px;
    background: var(--line-strong);
    flex-shrink: 0;
  }
  .brand-word {
    font-family: 'Source Serif 4', serif;
    font-size: 26px;
    letter-spacing: -0.01em;
    color: var(--ivory);
    white-space: nowrap;
  }
  .brand-word .bold { font-weight: 600; }
  .brand-word .italic { font-style: italic; font-weight: 500; margin-left: 6px; }
  .brand-word .sup {
    font-size: 12px;
    vertical-align: super;
    color: var(--brass);
    font-family: 'Hanken Grotesk', sans-serif;
    margin-left: 2px;
  }

  .meta-line {
    font-size: 14px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }

  .subhead {
    font-size: 16px;
    color: var(--text-mid);
    margin: 6px 0 28px;
    max-width: 680px;
    line-height: 1.55;
  }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 0.5px solid var(--line-strong);
    border-radius: 8px;
    padding: 10px 14px;
    min-width: 240px;
  }
  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--ivory);
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 14px;
    width: 100%;
  }
  .search-box input::placeholder { color: var(--text-dim); }
  .search-box svg { flex-shrink: 0; opacity: 0.5; }

  .filter-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 20px;
    border: 0.5px solid var(--line-strong);
    background: transparent;
    color: var(--text-mid);
    cursor: pointer;
    font-family: 'Hanken Grotesk', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { background: rgba(255,255,255,0.05); }
  .chip.active {
    background: var(--brass);
    color: var(--ink);
    border-color: var(--brass);
    font-weight: 500;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
    table-layout: fixed;
  }

  col.col-chain { width: 26%; }
  col.col-score { width: 13%; }
  col.col-tier { width: 10%; }
  col.col-div { width: 13%; }
  col.col-date { width: 15%; }

  thead th {
    text-align: left;
    padding: 12px 10px;
    font-weight: 500;
    color: var(--text-dim);
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 0.5px solid var(--line-strong);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--ivory); }
  thead th.sorted { color: var(--brass); }
  thead th .arrow { font-size: 10px; margin-left: 3px; opacity: 0.7; }

  thead th.num, tbody td.num { text-align: right; }
  thead th.num[data-key="tradfi_score"],
  thead th.num[data-key="ai_score"] { padding-right: 44px; }
  thead th.center, tbody td.center { text-align: center; }

  tbody tr {
    border-bottom: 0.5px solid var(--line);
    cursor: pointer;
    transition: background 0.1s;
  }
  tbody tr:hover { background: rgba(255,255,255,0.03); }

  tbody td {
    padding: 15px 10px;
    vertical-align: middle;
  }

  .chain-cell {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chain-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--brass-dim);
    flex-shrink: 0;
  }
  .chain-name { font-weight: 500; color: var(--ivory); font-size: 15px; }
  .chain-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .score-cell {
    display: grid;
    grid-template-columns: 1fr 30px;
    align-items: center;
    gap: 4px;
  }
  .score-num {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 17px;
    text-align: right;
  }
  .cap-slot {
    display: flex;
    justify-content: flex-start;
  }
  .cap-flag {
    position: relative;
    font-size: 10px;
    color: var(--text-dim);
    border: 0.5px solid var(--line-strong);
    border-radius: 3px;
    padding: 2px 5px;
    line-height: 1.4;
    cursor: help;
  }

  .tier-badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 5px;
    border: 0.5px solid;
    white-space: nowrap;
    cursor: help;
  }
  .tier-dot { width: 5px; height: 5px; border-radius: 50%; }

  .tooltip {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: calc(100% + 7px);
    left: 50%;
    transform: translateX(-50%);
    background: #16233A;
    color: var(--ivory);
    border: 0.5px solid var(--line-strong);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: 'Hanken Grotesk', sans-serif;
    font-weight: 400;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    z-index: 20;
    transition: opacity 0.12s, visibility 0.12s;
    pointer-events: none;
  }
  .tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #16233A;
  }
  .tooltip.wide {
    white-space: normal;
    width: 230px;
    line-height: 1.5;
    font-size: 12.5px;
    left: 0;
    transform: none;
  }
  .tooltip.wide::after { left: 16px; transform: none; }
  .cap-flag:hover .tooltip,
  .tier-badge:hover .tooltip,
  .info-label:hover .tooltip,
  .gate-pill:hover .tooltip {
    visibility: visible;
    opacity: 1;
  }

  .divergence-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
  }
  .div-pos { color: #8FBF87; }
  .div-neg { color: #D98F7A; }
  .div-zero { color: var(--text-dim); }

  .loading-state {
    padding: 40px 0;
    text-align: center;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .row-count {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .footer-links {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 0.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 13px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }
  .footer-x-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--brass);
    text-decoration: none;
    transition: color 0.15s;
  }
  .footer-x-link:hover { color: var(--ivory); }
  .footer-copyright { color: var(--text-dim); }
  .footer-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .footer-const-link {
    color: var(--brass);
    text-decoration: none;
    transition: color 0.15s;
  }
  .footer-const-link:hover { color: var(--ivory); }

  /* ---------- Tile grid (landing view) ---------- */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 8px;
  }
  .tile {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid var(--line-strong);
    border-radius: 10px;
    padding: 16px 18px;
    cursor: pointer;
    transition: transform 0.14s, border-color 0.14s, background 0.14s;
  }
  .tile:hover { transform: translateY(-2px); border-color: var(--brass); background: rgba(255,255,255,0.05); }
  .tile-medium { grid-column: span 2; }
  .tile-small { grid-column: span 1; }
  .tile-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--brass);
    margin-bottom: 6px;
  }
  .tile-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ivory);
    margin-bottom: 10px;
  }
  .tile-medium .tile-title { font-size: 20px; }
  .tile-preview {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .tile-preview li { display: flex; justify-content: space-between; padding: 3px 0; }
  .tile-preview .tv { font-family: 'IBM Plex Mono', monospace; color: var(--text-mid); }
  .tile-medium .tile-preview { columns: 2; column-gap: 18px; }
  .tile-desc { font-size: 12px; color: var(--text-dim); line-height: 1.55; }

  /* ---------- Active view: rail + pane ---------- */
  #activeView { display: none; gap: 20px; align-items: flex-start; }
  #activeView.open { display: flex; }
  .rail {
    width: 200px;
    flex: none;
    background: rgba(255,255,255,0.03);
    border: 0.5px solid var(--line-strong);
    border-radius: 10px;
    padding: 8px;
    position: sticky;
    top: 16px;
  }
  .rail-back {
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
    background: none; border: none; font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; color: var(--text-dim); cursor: pointer; padding: 9px 10px;
    border-radius: 7px; margin-bottom: 4px;
  }
  .rail-back:hover { background: rgba(255,255,255,0.05); color: var(--ivory); }
  .rail-item {
    display: block; width: 100%; text-align: left; background: none; border: none;
    cursor: pointer; padding: 9px 10px; border-radius: 7px; font-size: 13px;
    color: var(--text-dim); border-left: 2px solid transparent; font-family: 'Hanken Grotesk', sans-serif;
  }
  .rail-item:hover { background: rgba(255,255,255,0.05); color: var(--ivory); }
  .rail-item.current { background: rgba(198,161,91,0.08); color: var(--ivory); border-left-color: var(--brass); font-weight: 500; border-radius: 0 7px 7px 0; }
  .rail-item .k {
    display: block; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
    color: var(--brass); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1px;
  }
  .rail-div { height: 0.5px; background: var(--line-strong); margin: 6px 4px; }

  .view-pane { flex: 1; min-width: 0; }
  .view-pane-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .view-pane-head h2 {
    font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 20px;
    color: var(--ivory); margin: 0;
  }
  .share-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; background: none;
    border: 0.5px solid var(--line-strong); color: var(--text-dim); border-radius: 6px;
    padding: 7px 12px; cursor: pointer; transition: border-color 0.15s, color 0.15s;
  }
  .share-btn:hover { border-color: var(--brass); color: var(--brass); }
  .share-btn.copied { color: #8FBF87; border-color: #8FBF87; }

  /* ---------- Ranked single-metric view (track + marker bars) ---------- */
  .rank-list { display: flex; flex-direction: column; gap: 2px; }
  .rank-row {
    display: grid; grid-template-columns: 220px 1fr 88px; align-items: center;
    gap: 14px; padding: 9px 6px; border-radius: 7px; cursor: pointer;
  }
  .rank-row:hover { background: rgba(255,255,255,0.03); }
  .rank-rank {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim);
    width: 18px; display: inline-block;
  }
  .rank-name { font-size: 13.5px; color: var(--ivory); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-name .chain-tag { margin: 0 4px; }
  .rank-track {
    position: relative; height: 18px; background: rgba(255,255,255,0.05);
    border: 0.5px solid var(--line-strong); border-radius: 4px; overflow: hidden;
  }
  .rank-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--brass); opacity: 0.55; }
  .rank-val {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-align: right;
    font-weight: 500; color: var(--ivory);
  }
  .rank-val.dim { color: var(--text-dim); font-weight: 400; }
  .rank-loading { padding: 30px 0; text-align: center; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .rank-note {
    margin: 0 0 14px; padding: 9px 12px; border-radius: 7px;
    background: rgba(198,161,91,0.07); border: 0.5px solid rgba(198,161,91,0.25);
    font-size: 12.5px; color: var(--text-mid); line-height: 1.5;
  }

  /* ---------- Slide-out panel ---------- */

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,8,14,0.6);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    z-index: 100;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 560px;
    max-width: 92vw;
    background: var(--ink-2);
    border-left: 0.5px solid var(--line-strong);
    box-shadow: -24px 0 60px rgba(0,0,0,0.45);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1);
    z-index: 101;
    overflow-y: auto;
  }
  .panel.open { transform: translateX(0); }

  .panel-inner { padding: 28px 30px 60px; }

  .panel-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .panel-close {
    width: 32px;
    height: 32px;
    border-radius: 7px;
    border: 0.5px solid var(--line-strong);
    background: rgba(255,255,255,0.03);
    color: var(--text-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .panel-close:hover { background: rgba(255,255,255,0.08); color: var(--ivory); }

  .panel-name {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 26px;
    color: var(--ivory);
    line-height: 1.15;
  }
  .panel-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--brass);
    margin-top: 4px;
  }
  .panel-dates {
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 10px;
  }

  .panel-summary {
    margin-top: 18px;
    padding: 15px 16px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 0.5px solid var(--line);
  }
  .panel-summary-text {
    font-size: 13.5px;
    color: var(--text-mid);
    line-height: 1.62;
  }
  .panel-summary-divider {
    height: 1px;
    background: var(--line);
    margin: 13px 0;
  }
  .panel-summary-divergence {
    font-size: 13px;
    color: var(--text-mid);
    line-height: 1.5;
  }
  .panel-summary-divergence strong { color: var(--ivory); font-family: 'IBM Plex Mono', monospace; }

  .axis-block {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 0.5px solid var(--line);
  }
  .axis-block:first-of-type { margin-top: 24px; }

  .axis-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .axis-title {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .axis-score-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .axis-score {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 30px;
    color: var(--ivory);
  }

  .raw-note {
    margin: -4px 0 16px;
    padding: 9px 12px;
    border-radius: 7px;
    background: rgba(198,161,91,0.07);
    border: 0.5px solid rgba(198,161,91,0.25);
    font-size: 12.5px;
    color: var(--text-mid);
    line-height: 1.5;
  }
  .raw-note strong { color: var(--brass); font-family: 'IBM Plex Mono', monospace; }

  .gate-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .gate-pill {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--line-strong);
    color: var(--text-mid);
    font-family: 'Hanken Grotesk', sans-serif;
    cursor: help;
  }
  .gate-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .gate-pass .gate-dot { background: #56A374; }
  .gate-partial .gate-dot { background: #D2A94F; }
  .gate-fail .gate-dot { background: #C0655C; }
  .gate-unknown .gate-dot { background: var(--text-dim); }

  .cat-row {
    display: grid;
    grid-template-columns: 150px 1fr 30px;
    align-items: center;
    gap: 12px;

<script>
let BOARD = null;

const tierMap = {};

const COLUMNS = [
  { key: 'chain', label: 'Chain', sortable: true, align: 'left' },
  { key: 'tradfi_score', label: 'TradFi', sortable: true, align: 'num' },
  { key: 'tradfi_tier', label: 'Tier', sortable: false, align: 'center' },
  { key: 'ai_score', label: 'AI', sortable: true, align: 'num' },
  { key: 'ai_tier', label: 'Tier', sortable: false, align: 'center' },
  { key: 'divergence', label: 'Divergence', sortable: true, align: 'num' },
  { key: 'last_updated', label: 'Updated', sortable: true, align: 'left' },
];

let sortKey = 'tradfi_score';
let sortDir = -1;
let activeTierFilter = null;
let searchTerm = '';

/* ---------- Dashboard Tiles: view config + chain-detail cache ---------- */
/* Chain-detail JSON is still fetched lazily, never bundled into board.json or
   embedded in this file — see Dashboard_Build_Handoff.md's design decisions.
   The only change here is WHEN "lazily" happens: previously only on opening a
   chain's slideout panel, now also (once, in parallel, then cached) the first
   time any single-metric tile view is opened. board.json alone still drives
   the initial page render and the two board tiles' previews. */
let CHAIN_CACHE = {};

const ORDER = ['tradfi','ai','divergence','privacy','rwu','onchain','tokenomics','decentralization','cost','yield'];

// Board-tile and Divergence-tile previews show this many chains in the grid
// card itself (2-column list) — separate from the full ranked list shown
// once the tile is opened, which always covers every scored chain.
const BOARD_PREVIEW_COUNT = 10;

const VIEW_META = {
  tradfi: { kind: 'medium', railKey: 'TF', title: 'TradFi Board', eyebrow: 'Axis 1 — institutional lens' },
  ai: { kind: 'medium', railKey: 'AI', title: 'AI Board', eyebrow: 'Axis 2 — agent-readiness lens' },
  divergence: { kind: 'medium', railKey: 'DIV', title: 'Score Divergence', eyebrow: 'TradFi vs. AI, both axes' },
  privacy: { kind: 'small', railKey: 'PRIV', title: 'Top Privacy Chains', eyebrow: 'Category view' },
  rwu: { kind: 'small', railKey: 'RWU', title: 'Top Real-World Utility', eyebrow: 'Category view' },
  onchain: { kind: 'small', railKey: 'OCH', title: 'Top On-Chain Health', eyebrow: 'Category view' },
  tokenomics: { kind: 'small', railKey: 'TOK', title: 'Top Tokenomics & Supply', eyebrow: 'Category view' },
  decentralization: { kind: 'small', railKey: 'DECN', title: 'Top Decentralization', eyebrow: 'Category view' },
  cost: { kind: 'small', railKey: 'COST', title: 'Cheapest Tx Cost', eyebrow: 'Extra data' },
  yield: { kind: 'small', railKey: 'YLD', title: 'Fee Yield (Price/Fee)', eyebrow: 'Extra data' }
};

// Single-metric ranked views. `axis` + `catKey` locate the value inside a
// chain's detail JSON: 'tradfi'/'ai' read detail[axis].categories[catKey],
// 'tiles' reads detail.tiles[catKey]. Never weighted into either framework —
// presentation only, same as the categories and tiles fields themselves.
const METRIC_VIEWS = {
  privacy: { axis: 'tradfi', catKey: 'privacy_confidentiality', unit: 'score',
    desc: 'Ranked by the TradFi Privacy & Confidentiality category score (0–100).' },
  rwu: { axis: 'tradfi', catKey: 'real_world_utility', unit: 'score',
    desc: 'Ranked by the TradFi Real-World Utility category score (0–100).' },
  onchain: { axis: 'tradfi', catKey: 'on_chain_health', unit: 'score',
    desc: 'Ranked by the TradFi On-Chain Health category score (0–100) — real usage, fees, activity.' },
  tokenomics: { axis: 'tradfi', catKey: 'tokenomics_supply', unit: 'score',
    desc: 'Ranked by the TradFi Tokenomics & Supply category score (0–100) — caps, emission, concentration.' },
  decentralization: { axis: 'tradfi', catKey: 'decentralization', unit: 'score',
    desc: 'Ranked by the TradFi Decentralization category score (0–100).' },
  cost: { axis: 'tiles', catKey: 'cheapest_tx_cost_usd', noteKey: 'cheapest_tx_cost_note', unit: 'usd', ascending: true, logScale: true,
    desc: 'USD cost of one standard native transfer, current floor/base fee rate. Presentation only — never weighted into either score. Cheapest first.' },
  yield: { axis: 'tiles', catKey: 'fee_yield_pct', noteKey: 'fee_yield_note', unit: 'pf', logScale: true,
    desc: 'Trailing 30-day chain fee revenue, annualized, vs. current market cap — shown as an implied price/fee multiple (market cap ÷ annualized fees), the inverse of the raw yield percentage. Lower multiple means the market is pricing the chain closer to the fee revenue it already generates. Presentation only — never weighted into either score. Richest (lowest multiple) first.' }
};

function fmtCost(v) {
  if (v === null || v === undefined) return '—';
  if (v === 0) return '$0';
  const abs = Math.abs(v);
  const decimals = abs >= 1 ? 2 : abs >= 0.01 ? 4 : abs >= 0.0001 ? 6 : 8;
  const s = v.toFixed(decimals).replace(/0+$/, '').replace(/\.$/, '');
  return '$' + s;
}
function fmtPct(v) {
  if (v === null || v === undefined) return '—';
  if (v === 0) return '0%';
  const abs = Math.abs(v);
  const decimals = abs >= 1 ? 2 : abs >= 0.01 ? 3 : abs >= 0.001 ? 4 : 5;
  const s = v.toFixed(decimals).replace(/0+$/, '').replace(/\.$/, '');
  return s + '%';
}
// Fee Yield's raw percentage (fees ÷ market cap) reads as an unintuitive
// wall of leading zeros for most chains (XRP: 0.00017%) — the same figure
// inverted, as a price/fee multiple, is the format this project already
// uses everywhere else (session files, Scorecard board notes: "~226x",
// "~7.4x"). fmtMetric calls this for unit 'pf'; fmtPct above is kept for
// the raw-percentage tooltip on those rows.
function fmtPF(v) {
  if (v === null || v === undefined || v === 0) return '—';
  const mult = 100 / v;
  if (mult < 20) return mult.toFixed(1) + 'x';
  return Math.round(mult).toLocaleString('en-US') + 'x';
}
function fmtMetric(v, mv) {
  if (v === null || v === undefined) return '—';
  if (mv.unit === 'usd') return fmtCost(v);
  if (mv.unit === 'pf') return fmtPF(v);
  return String(v);
}
// Bar width for the rank-list track. Cheapest Tx Cost and Fee Yield both
// span 4-5 orders of magnitude across the board (XLM's $0.000002 floor to
// TRON's $0.09; Canton's 13.46% to XRP's 0.00017%) — a plain linear scale
// against the richest chain leaves every other bar visually flat at the
// 2% floor. Log scale keeps every chain's bar visually distinguishable.
function barPercent(v, rows, mv) {
  if (mv.logScale) {
    const vals = rows.map(r => r.v).filter(x => x > 0);
    if (!vals.length) return 4;
    const logMin = Math.log10(Math.min(...vals));
    const logMax = Math.log10(Math.max(...vals));
    let range = logMax - logMin;
    if (!isFinite(range) || range <= 0) range = 1;
    const t = (Math.log10(Math.max(v, 1e-12)) - logMin) / range;
    return Math.max(4, Math.round(t * 100));
  }
  const scaleMax = Math.max(...rows.map(r => r.v), 1e-12);
  return Math.max(2, Math.round((v / scaleMax) * 100));
}
function metricValue(detail, mv) {
  if (mv.axis === 'tiles') return detail.tiles ? (detail.tiles[mv.catKey] ?? null) : null;
  const cats = detail[mv.axis] && detail[mv.axis].categories;
  return cats ? (cats[mv.catKey] ?? null) : null;
}
function metricNote(detail, mv) {
  if (!mv.noteKey || !detail.tiles) return '';
  return detail.tiles[mv.noteKey] || '';
}

async function fetchAllChains() {
  const missing = BOARD.chains.filter(c => !CHAIN_CACHE[c.slug]);
  if (!missing.length) return CHAIN_CACHE;
  await Promise.all(missing.map(async c => {
    try {
      const res = await fetch(c.detail_url);
      if (res.ok) CHAIN_CACHE[c.slug] = await res.json();
    } catch (err) { console.error('fetch failed for', c.slug, err); }
  }));
  return CHAIN_CACHE;
}

function renderGrid() {
  const grid = document.getElementById('gridView');
  const tfTop = [...BOARD.chains].sort((a, b) => b.tradfi_score - a.tradfi_score).slice(0, BOARD_PREVIEW_COUNT);
  const aiTop = [...BOARD.chains].sort((a, b) => b.ai_score - a.ai_score).slice(0, BOARD_PREVIEW_COUNT);
  const divTop = [...BOARD.chains].sort((a, b) => Math.abs(b.divergence) - Math.abs(a.divergence)).slice(0, BOARD_PREVIEW_COUNT);

  const bodies = {
    tradfi: `<ul class="tile-preview">${tfTop.map(c => `<li><span>${c.cashtag}</span><span class="tv">${c.tradfi_score}</span></li>`).join('')}</ul>`,
    ai: `<ul class="tile-preview">${aiTop.map(c => `<li><span>${c.cashtag}</span><span class="tv">${c.ai_score}</span></li>`).join('')}</ul>`,
    divergence: `<ul class="tile-preview">${divTop.map(c => `<li><span>${c.cashtag}</span>${divergenceCell(c.divergence)}</li>`).join('')}</ul>`,
    privacy: `<div class="tile-desc">${METRIC_VIEWS.privacy.desc}</div>`,
    rwu: `<div class="tile-desc">${METRIC_VIEWS.rwu.desc}</div>`,
    onchain: `<div class="tile-desc">${METRIC_VIEWS.onchain.desc}</div>`,
    tokenomics: `<div class="tile-desc">${METRIC_VIEWS.tokenomics.desc}</div>`,
    decentralization: `<div class="tile-desc">${METRIC_VIEWS.decentralization.desc}</div>`,
    cost: `<div class="tile-desc">USD cost of one standard native transfer, ranked cheapest to priciest.</div>`,
    yield: `<div class="tile-desc">Trailing 30-day annualized fee revenue vs. market cap, shown as a price/fee multiple — lower means richer.</div>`
  };

  grid.innerHTML = ORDER.map(key => {
    const m = VIEW_META[key];
    const sizeClass = m.kind === 'medium' ? 'tile-medium' : 'tile-small';
    return `<div class="tile ${sizeClass}" data-key="${key}">
      <div class="tile-eyebrow">${m.eyebrow}</div>
      <div class="tile-title">${m.title}</div>
      ${bodies[key]}
    </div>`;
  }).join('');

  grid.querySelectorAll('.tile').forEach(el => {
    el.addEventListener('click', () => openView(el.dataset.key));
  });
}

function renderRail(activeKey) {
  const rail = document.getElementById('rail');
  const items = ORDER.map(key => {
    const m = VIEW_META[key];
    return `<button class="rail-item ${key === activeKey ? 'current' : ''}" data-key="${key}"><span class="k">${m.railKey}</span>${m.title}</button>`;
  }).join('');
  rail.innerHTML = `<button class="rail-back" id="railBack">← All views</button><div class="rail-div"></div>${items}`;
  document.getElementById('railBack').addEventListener('click', closeView);
  rail.querySelectorAll('.rail-item').forEach(btn => {
    btn.addEventListener('click', () => openView(btn.dataset.key));
  });
}

function openBoardView(axisKey) {
  document.getElementById('rankSubview').style.display = 'none';
  document.getElementById('boardSubview').style.display = '';

  sortKey = axisKey === 'tradfi' ? 'tradfi_score' : 'ai_score';
  sortDir = -1;
  activeTierFilter = null;
  searchTerm = '';
  document.getElementById('searchInput').value = '';

  mobileAxis = axisKey;
  mobileTierFilter = null;
  mobileSearchTerm = '';
  document.getElementById('searchInputMobile').value = '';

async function openMetricView(key) {
  const mv = METRIC_VIEWS[key];
  document.getElementById('boardSubview').style.display = 'none';
  document.getElementById('rankSubview').style.display = '';
  const noteEl = document.getElementById('rankNote');
  noteEl.textContent = mv.desc;
  noteEl.style.display = '';
  document.getElementById('rankList').innerHTML = '<div class="rank-loading">Loading chain detail…</div>';

  await fetchAllChains();

  const rows = [];
  const naRows = [];
  BOARD.chains.forEach(c => {
    const detail = CHAIN_CACHE[c.slug];
    if (!detail) return;
    const v = metricValue(detail, mv);
    const note = metricNote(detail, mv);
    if (v === null || v === undefined) {
      naRows.push({ slug: c.slug, name: c.name, cashtag: c.cashtag, note });
    } else {
      rows.push({ slug: c.slug, name: c.name, cashtag: c.cashtag, v, note });
    }
  });
  rows.sort((a, b) => mv.ascending ? a.v - b.v : b.v - a.v);

  const esc = (s) => (s || '').replace(/"/g, '&quot;');
  let html = rows.map((r, i) => {
    const pct = mv.unit === 'score' ? Math.max(2, Math.round(r.v)) : barPercent(r.v, rows, mv);
    const tooltipPrefix = mv.unit === 'pf' ? `${fmtPct(r.v)} of market cap in annualized fees. ` : '';
    return `<div class="rank-row" data-slug="${r.slug}" title="${esc(tooltipPrefix + r.note)}">
      <div class="rank-name"><span class="rank-rank">${i + 1}</span><span class="chain-tag">${r.cashtag}</span>${r.name}</div>
      <div class="rank-track"><div class="rank-fill" style="width:${pct}%"></div></div>
      <div class="rank-val">${fmtMetric(r.v, mv)}</div>
    </div>`;
  }).join('');
  html += naRows.map(r => `<div class="rank-row" data-slug="${r.slug}" title="${esc(r.note)}">
      <div class="rank-name"><span class="rank-rank">—</span><span class="chain-tag">${r.cashtag}</span>${r.name}</div>
      <div class="rank-track"></div>
      <div class="rank-val dim">—</div>
    </div>`).join('');

  document.getElementById('rankList').innerHTML = html;
  document.getElementById('rankList').querySelectorAll('.rank-row').forEach(row => {
    row.addEventListener('click', () => openPanel(row.dataset.slug));
  });
}

// Divergence needs no chain-detail fetch at all — board.json already carries
// tradfi_score, ai_score, and divergence per chain, so this is the cheapest
// view to open of any of them. Sign convention matches the existing board
// table's Divergence column: positive = TradFi outscores AI, negative = AI
// outscores TradFi.
function openDivergenceView() {
  document.getElementById('boardSubview').style.display = 'none';
  document.getElementById('rankSubview').style.display = '';
  const noteEl = document.getElementById('rankNote');
  noteEl.textContent = 'Ranked by |TradFi score − AI score|, widest gap first. Green favors TradFi, red favors AI — same convention as the board table\'s Divergence column.';
  noteEl.style.display = '';

  const rows = [...BOARD.chains].sort((a, b) => Math.abs(b.divergence) - Math.abs(a.divergence));
  const scaleMax = Math.max(...rows.map(r => Math.abs(r.divergence)), 1e-12);

  const html = rows.map((r, i) => {
    const pct = Math.max(2, Math.round((Math.abs(r.divergence) / scaleMax) * 100));
    const barColor = r.divergence > 0 ? '#8FBF87' : r.divergence < 0 ? '#D98F7A' : 'var(--text-dim)';
    return `<div class="rank-row" data-slug="${r.slug}" title="TradFi ${r.tradfi_score} · AI ${r.ai_score}">
      <div class="rank-name"><span class="rank-rank">${i + 1}</span><span class="chain-tag">${r.cashtag}</span>${r.name}</div>
      <div class="rank-track"><div class="rank-fill" style="width:${pct}%;background:${barColor};opacity:0.65"></div></div>
      <div class="rank-val">${divergenceCell(r.divergence)}</div>
    </div>`;
  }).join('');

  document.getElementById('rankList').innerHTML = html;
  document.getElementById('rankList').querySelectorAll('.rank-row').forEach(row => {
    row.addEventListener('click', () => openPanel(row.dataset.slug));
  });
}

async function openView(key) {
  if (!VIEW_META[key]) return;
  document.getElementById('gridView').style.display = 'none';
  document.getElementById('activeView').classList.add('open');
  renderRail(key);
  document.getElementById('activeTitle').textContent = VIEW_META[key].title;
  history.replaceState(null, '', '#view=' + key);
  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (key === 'tradfi' || key === 'ai') {
    openBoardView(key);
  } else if (key === 'divergence') {
    openDivergenceView();
  } else {
    await openMetricView(key);
  }
}

function closeView() {
  document.getElementById('activeView').classList.remove('open');
  document.getElementById('gridView').style.display = '';

}

function tierBadge(code) {

function capFlag(axis) {

function divergenceCell(d) {
  const cls = d > 0 ? 'div-pos' : d < 0 ? 'div-neg' : 'div-zero';
  const sign = d > 0 ? '+' : '';
  return `<span class="divergence-cell ${cls}">${sign}${d}</span>`;
}

function renderHead() {
  const tr = document.getElementById('tableHead');
  tr.innerHTML = COLUMNS.map(c => {
    const cls = ['num','center'].includes(c.align) ? c.align : '';
    const sorted = c.sortable && c.key === sortKey ? 'sorted' : '';
    const arrow = c.sortable && c.key === sortKey ? `<span class="arrow">${sortDir === 1 ? '▲' : '▼'}</span>` : '';
    return `<th class="${cls} ${sorted}" data-key="${c.key}" data-sortable="${c.sortable}">${c.label}${arrow}</th>`;
  }).join('');

  tr.querySelectorAll('th').forEach(th => {
    if (th.dataset.sortable === 'true') {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (sortKey === key) { sortDir *= -1; }
        else { sortKey = key; sortDir = -1; }
        renderHead();
        renderBody();
      });
    }
  });
}

function getFiltered() {
  let rows = BOARD.chains.slice();
  if (activeTierFilter) {
    rows = rows.filter(r => r.tradfi_tier === activeTierFilter || r.ai_tier === activeTierFilter);
  }
  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    rows = rows.filter(r => r.name.toLowerCase().includes(s) || r.ticker.toLowerCase().includes(s) || r.cashtag.toLowerCase().includes(s));
  }
  return rows;
}

function renderBody() {
  let rows = getFiltered();

  rows.sort((a, b) => {
    let av = sortKey === 'chain' ? a.name : a[sortKey];
    let bv = sortKey === 'chain' ? b.name : b[sortKey];
    if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = rows.map(r => `
    <tr data-slug="${r.slug}">
      <td>
        <div class="chain-cell">
          <span class="chain-dot"></span>
          <span class="chain-name">${r.name}</span>
          <span class="chain-tag">${r.cashtag}</span>
        </div>
      </td>
      <td class="num">
        <div class="score-cell">
          <span class="score-num">${r.tradfi_score}</span>
          <span class="cap-slot">${r.tradfi_capped ? capFlag('tradfi') : ''}</span>
        </div>
      </td>
      <td class="center">${tierBadge(r.tradfi_tier)}</td>
      <td class="num">
        <div class="score-cell">
          <span class="score-num">${r.ai_score}</span>
          <span class="cap-slot">${r.ai_capped ? capFlag('ai') : ''}</span>
        </div>
      </td>
      <td class="center">${tierBadge(r.ai_tier)}</td>
      <td class="num">${divergenceCell(r.divergence)}</td>
      <td style="color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:13.5px;">${r.last_updated}</td>
    </tr>
  `).join('');

  document.getElementById('rowCount').textContent = `Showing ${rows.length} of ${BOARD.chains.length} chains`;

  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => openPanel(tr.dataset.slug));
  });
}

function renderChips() {
  const allTiers = [...BOARD.tiers.tradfi, ...BOARD.tiers.ai];
  const seen = new Set();
  const unique = allTiers.filter(t => { if (seen.has(t.code)) return false; seen.add(t.code); return true; });

  const container = document.getElementById('tierChips');
  let html = `<button class="chip ${activeTierFilter === null ? 'active' : ''}" data-code="">All tiers</button>`;
  html += unique.map(t => `<button class="chip ${activeTierFilter === t.code ? 'active' : ''}" data-code="${t.code}">${t.code}</button>`).join('');

    btn.addEventListener('click', () => {

function isMobile() {
  return window.matchMedia('(max-width: 720px)').matches;
}

async function initBoard() {
  try {
    const res = await fetch('data/board.json');
    if (!res.ok) throw new Error(`board.json fetch failed: ${res.status}`);
    BOARD = await res.json();

    BOARD.tiers.tradfi.forEach(t => tierMap[t.code] = t);
    BOARD.tiers.ai.forEach(t => tierMap[t.code] = t);

    document.getElementById('metaLine').textContent = `updated ${BOARD.meta.last_updated}`;
    document.getElementById('loadingState').style.display = 'none';

    renderGrid();
    document.getElementById('gridView').style.display = '';

    const hashMatch = location.hash.match(/view=([a-z]+)/);
    if (hashMatch && VIEW_META[hashMatch[1]]) {
      await openView(hashMatch[1]);
    }
  } catch (err) {
    document.getElementById('loadingState').textContent = 'Could not load board data. Please refresh the page.';
    console.error(err);
  }
}

initBoard();

let lastKnownMode = null;
window.addEventListener('resize', () => {
  if (!BOARD) return;
  const nowMobile = isMobile();
  if (lastKnownMode === null) { lastKnownMode = nowMobile; return; }
  if (nowMobile === lastKnownMode) return;
  lastKnownMode = nowMobile;

  // The tile grid and rail are pure CSS across the 720px breakpoint — nothing
  // to re-render there. Only the board sub-view (sortable table vs. tier-
  // grouped sections) needs its own JS render on each side, and only if it's
  // the one currently visible inside an open view.
  const viewOpen = document.getElementById('activeView').classList.contains('open');
  const boardVisible = viewOpen && document.getElementById('boardSubview').style.display !== 'none';
  if (!boardVisible) return;

  if (nowMobile) {
    document.getElementById('tableWrap').style.display = 'none';
    document.querySelector('.mobile-only').style.display = '';
    renderChipsMobile();
    renderSections();
  } else {
    document.querySelector('.mobile-only').style.display = 'none';
    document.getElementById('tableWrap').style.display = '';
    renderHead();
    renderChips();
    renderBody();
  }
});

function gateStateLabel(state) {
  return { pass: 'Pass', partial: 'Partial', fail: 'Fail', unknown: 'Unverified' }[state] || state;

function renderGates(axis, gates) {
  const labels = GATE_LABELS[axis];
  const descs = GATE_DESC[axis];
  return `<div class="gate-row">` + Object.keys(labels).map(key => {
    const state = gates[key] || 'unknown';
    return `<span class="gate-pill gate-${state}">
      <span class="gate-dot"></span>${labels[key]} · ${gateStateLabel(state)}
      <span class="tooltip wide">${descs[key]}</span>
    </span>`;
  }).join('') + `</div>`;
}

function renderCategories(axis, categories) {
  const defs = BOARD.category_labels[axis];
  const descs = CATEGORY_DESC[axis];
  return defs.map(def => {
    const val = categories[def.key];
    if (val === null || val === undefined) return '';
    const color = val >= 80 ? '#56A374' : val >= 60 ? '#A6B45A' : val >= 40 ? '#D2A94F' : val >= 20 ? '#CD8351' : '#C0655C';
    const desc = descs[def.key] || '';
    return `<div class="cat-row">
      <span class="cat-label info-label">${def.label}<span class="tooltip wide">${desc}</span></span>
      <div class="cat-track">
        <div class="cat-fill" style="width:${val}%;background:${color}"></div>
        <div class="cat-marker" style="left:${val}%;border-color:${color}"></div>
      </div>
      <span class="cat-val">${val}</span>
    </div>`;
  }).join('');
}

function renderFindings(items) {
  if (!items || !items.length) return '';
  return `<ul class="findings-list">` + items.map(f => `<li>${f}</li>`).join('') + `</ul>`;
}

function renderAxisBlock(axisKey, axisLabel, data) {
  const t = tierMap[data.tier_code];
  const color = t ? t.color_dark : '#C6A15B';
  let html = `<div class="axis-block">

  html += renderCategories(axisKey, data.categories);
  html += renderFindings(data.key_findings);
  html += `</div>`;
  return html;
}

    </div>
    <div class="loading-state">Loading detail…</div>
  `;
  document.getElementById('panelCloseBtn').addEventListener('click', closePanel);
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  let detail = CHAIN_CACHE[slug];
  if (!detail) {
    try {
      const res = await fetch(row.detail_url);
      if (!res.ok) throw new Error(`${row.detail_url} fetch failed: ${res.status}`);
      detail = await res.json();
      CHAIN_CACHE[slug] = detail;
    } catch (err) {
      document.getElementById('panelInner').innerHTML += `<div class="loading-state">Could not load this chain's detail. Please try again.</div>`;
      console.error(err);
      return;
    }
  }

  const divSign = row.divergence > 0 ? '+' : '';
  const divWord = row.divergence > 0 ? 'TradFi outscores AI' : row.divergence < 0 ? 'AI outscores TradFi' : 'Scores are even';

  let html = `
    <div class="panel-top">
      <div>
        <div class="panel-name">${detail.name}</div>
        <div class="panel-tag">${detail.cashtag}</div>
      </div>
      <button class="panel-close" id="panelCloseBtn" aria-label="Close">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="panel-dates">Scored ${detail.scored_date} · Updated ${detail.last_updated}</div>

    <div class="panel-summary">
      <div class="panel-summary-text">${detail.executive_summary || ''}</div>
      <div class="panel-summary-divider"></div>
      <div class="panel-summary-divergence">Divergence <strong>${divSign}${row.divergence}</strong> — ${divWord}.</div>
    </div>

    ${renderAxisBlock('tradfi', 'TradFi Score', detail.tradfi)}
    ${renderAxisBlock('ai', 'AI Score', detail.ai)}

    <div class="watch-block">
      <span class="axis-title">Watch Items</span>
      ${renderFindings(detail.watch_items)}
    </div>

    <div class="external-links">
      <span class="axis-title">Learn More</span>
      <div class="external-links-row">
        <a class="ext-link" href="https://www.coingecko.com/en/coins/${(EXTERNAL_SLUGS[slug]||{}).cg}" target="_blank" rel="noopener">
          CoinGecko
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg>
        </a>
        <a class="ext-link" href="https://coinmarketcap.com/currencies/${(EXTERNAL_SLUGS[slug]||{}).cmc}/" target="_blank" rel="noopener">
          CoinMarketCap
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg>
        </a>
      </div>
    </div>
  `;

  document.getElementById('panelInner').innerHTML = html;
  document.getElementById('panelCloseBtn').addEventListener('click', closePanel);
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('overlay').addEventListener('click', closePanel);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePanel();
});
</script>
